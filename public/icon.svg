<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="nestRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#4f46e5" stroke-opacity="0.4" stroke-width="2" />

  <!-- Subtle Inner Ring for Nest effect -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Outer Interlocking Nest Ring -->
  <path d="M 64 26 C 85 26 102 43 102 64 C 102 75 97 85 89 92" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 64 102 C 43 102 26 85 26 64 C 26 53 31 43 39 36" fill="none" stroke="url(#nestRingGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Interlocking Link / Chain Loops -->
  <g transform="translate(64, 64) rotate(-35) translate(-64, -64)">
    <!-- First Link Loop -->
    <rect x="36" y="52" width="40" height="24" rx="12" fill="none" stroke="url(#primaryGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Second Link Loop (Interlocking) -->
    <rect x="52" y="52" width="40" height="24" rx="12" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Glowing Connection Nodes (Nesting Seeds) -->
  <circle cx="39" cy="36" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="89" cy="92" r="4.5" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#glow)" />
</svg>
